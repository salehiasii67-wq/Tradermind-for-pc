name: Build Electron App (Mac & Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm --filter @workspace/tradermind run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          PORT: '3000'
          BASE_PATH: '/'
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TraderMind-macOS-DMG
          path: artifacts/tradermind/dist-electron/**/*.dmg
          retention-days: 30

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm --filter @workspace/tradermind run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORT: '3000'
          BASE_PATH: '/'
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: TraderMind-Linux-AppImage
          path: artifacts/tradermind/dist-electron/**/*.AppImage
          retention-days: 30
